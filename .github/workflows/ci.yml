name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-check:
    name: Contributor Identity Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for banned identities in commit history
        run: |
          BANNED="shahrahman-fb\|shahrahman@meta\.com"
          BAD=$(git log --format="%H %ae %ce" | grep -E "$BANNED" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Banned identity found in commit history:"
            echo "$BAD"
            exit 1
          fi
          echo "✅ All commit identities are clean."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff formatter check
        run: ruff format --check src tests

  docs-validation:
    name: Docs Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check version consistency
        run: python scripts/ci/check_version_consistency.py

      - name: Check workflow path references exist
        run: python scripts/ci/check_workflow_paths.py

      - name: Check for broken internal links
        run: python scripts/ci/check_doc_links.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy torch numpy types-protobuf

      - name: Run mypy
        run: mypy src/torchbridge --ignore-missing-imports

  xla-cpu:
    name: XLA Tests (torch_xla, CPU-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # torch_xla runs on the CPU when PJRT_DEVICE=CPU, so every XLA code path
    # can be exercised without a TPU and without spend. Without this job the
    # XLA branches are never taken in CI: the TPU tests all pass purely
    # because torch_xla is absent, and two of them were asserting the
    # environment rather than the behaviour they were named for.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned: torch_xla publishes a wheel per Python minor, and 2.9.0
          # has cp313. Widening this needs the wheel checked first.
          python-version: "3.13"

      - name: Install torch and torch_xla
        run: |
          python -m pip install --upgrade pip
          # torch first, from the CPU index, because torch_xla 2.9 is built
          # against torch 2.9 and a newer torch breaks it at the C++ ABI.
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install torch_xla==2.9.0
          # --no-deps so the project's torch>=2.0,<3.0 range cannot pull the
          # pin back out from under torch_xla.
          pip install -e . --no-deps
          pip install pytest transformers

      - name: Confirm XLA is really present
        env:
          PJRT_DEVICE: CPU
        run: |
          python - <<'EOF'
          import torch, torch_xla
          import torch_xla.core.xla_model as xm
          from torchbridge.backends.tpu.xla_compat import get_device_hw_type
          print(f"torch {torch.__version__} | torch_xla {torch_xla.__version__}")
          print(f"device {xm.xla_device()} | hw {get_device_hw_type()}")
          assert str(xm.xla_device()).startswith("xla"), "no XLA device — the job would prove nothing"
          EOF

      - name: Run the TPU and XLA tests against a real torch_xla
        env:
          PJRT_DEVICE: CPU
        run: |
          # Listed explicitly rather than running tests/, because most of the
          # suite has nothing to do with XLA and this job pins an older torch.
          # Add new XLA-touching files here as they arrive.
          pytest tests/backends/test_tpu_backend.py \
                 tests/backends/test_tpu_config.py \
                 tests/backends/test_xla_compat.py \
                 tests/unit/test_trace_validator.py \
                 -v --tb=short

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            -m "not gpu and not slow and not tpu and not amd" \
            --cov=src/torchbridge \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run TorchBridge validation
        # --ci documents its exit codes as 0=all pass, 1=failures, 2=warnings
        # only. A GitHub runner has no GPU, so "No CUDA GPU detected" is always
        # a warning and this step always exited 2 — which is why it carried
        # continue-on-error, and why a genuine failure here would have been
        # invisible. Accept 2, fail on 1.
        run: |
          rc=0
          python -m torchbridge.cli.validate --ci --level quick || rc=$?
          if [ "$rc" = "1" ]; then
            echo "::error::tb-validate reported failures (exit 1)"
            exit 1
          fi
          echo "tb-validate exit $rc (0=pass, 2=warnings only) — accepted"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          verbose: true

  # GPU tests require a self-hosted runner — disabled until one is attached
  # test-gpu:
  #   name: Test GPU
  #   runs-on: [self-hosted, gpu, linux]
  #   ...

  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, type-check, test, docs-validation]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
