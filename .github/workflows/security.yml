name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans weekly on Monday at 3 AM UTC
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

  # CodeQL requires GitHub Advanced Security (free for public repos, paid for private).
  # Re-add this job after the repo is made public — it will work without any changes.
  # codeql: ...

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          bandit -r src/ -f json -o bandit-report.json --severity-level medium --confidence-level high
          bandit -r src/ -f txt --severity-level medium --confidence-level high

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires Dependency graph + GitHub Advanced Security — available on public repos.
    # continue-on-error until this repo is made public; remove this line after that.
    continue-on-error: true
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0

  pip-audit:
    name: Pip Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install "torch>=2.0.0,<3.0.0" "numpy>=1.21.0,<3.0.0"

      - name: Run pip-audit
        run: |
          # CVE-2026-3219: affects pip itself (tar+ZIP confusion); no fix released yet.
          # Ignored until pip publishes a patched version — not a TorchBridge runtime risk.
          pip-audit --desc on --format json --output pip-audit-report.json \
            --ignore-vuln CVE-2026-3219
          pip-audit --desc on --ignore-vuln CVE-2026-3219

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install truffleHog
        run: pip install truffleHog3

      - name: Run truffleHog
        run: |
          # --no-entropy: disables high-entropy heuristics that false-positive on URLs/paths;
          # real secrets (API keys, tokens) are caught by the --no-pattern scan below.
          trufflehog3 --no-history --no-entropy --format json . > secrets-report.json
          trufflehog3 --no-history --no-entropy .

      - name: Upload Secrets Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: secrets-scan-report
          path: secrets-report.json
          retention-days: 7
