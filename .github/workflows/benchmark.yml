name: Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/torchbridge/**'
      - 'tests/benchmark/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - 'src/torchbridge/**'
      - 'tests/benchmark/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-cpu:
    name: CPU Performance Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run benchmark tests
        run: |
          python -m pytest tests/benchmark/ -v -m benchmark
