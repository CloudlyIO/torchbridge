# =============================================================================
# Qwen3-0.6B Cross-Backend Validation
# TorchBridge Cloud Validation
#
# Validates Qwen3-0.6B text generation produces consistent outputs across:
# - CPU baseline
# - CUDA (A10G/T4 via self-hosted runners)
# - AMD ROCm (MI300X via self-hosted runner)
#
# Triggers:
# - Manual dispatch
# - Weekly (Sunday 4 AM UTC)
# - Changes to backend code
# =============================================================================

name: Cross-Backend Validation

on:
  workflow_dispatch:
    inputs:
      backends:
        description: 'Backends to test (comma-separated: cuda,rocm,cpu)'
        required: false
        default: 'cuda,rocm,cpu'

  schedule:
    # Weekly on Sunday at 4 AM UTC
    - cron: '0 4 * * 0'

  push:
    branches: [main]
    paths:
      - 'src/torchbridge/backends/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ===========================================================================
  # CPU Baseline (always runs)
  # ===========================================================================
  cpu-baseline:
    name: CPU Baseline (Qwen3-0.6B)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers
          pip install -e .

      - name: Run CPU validation
        run: |
          mkdir -p results
          python3 << 'PYEOF'
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer
          import torch.nn.functional as F
          import json

          print("=== Qwen3-0.6B CPU Baseline Validation ===")
          print(f"PyTorch: {torch.__version__}")
          print(f"Device: CPU")

          tokenizer = AutoTokenizer.from_pretrained("Qwen/Qwen3-0.6B")
          model = AutoModelForCausalLM.from_pretrained(
              "Qwen/Qwen3-0.6B", torch_dtype=torch.float32
          )
          model.eval()

          prompt = "The capital of France is"
          inputs = tokenizer(prompt, return_tensors="pt")

          with torch.no_grad():
              outputs = model(**inputs)

          logits = outputs.logits[:, -1, :]

          results = {
              "backend": "cpu",
              "model": "Qwen/Qwen3-0.6B",
              "logits_shape": list(logits.shape),
              "logits_mean": logits.mean().item(),
              "logits_std": logits.std().item(),
              "status": "PASSED"
          }

          with open("results/cpu_baseline.json", "w") as f:
              json.dump(results, f, indent=2)

          print(f"Logits shape: {logits.shape}")
          print(f"Status: PASSED")
          PYEOF

      - name: Upload CPU results
        uses: actions/upload-artifact@v7
        with:
          name: cpu-baseline-results
          path: results/
          retention-days: 30

  # ===========================================================================
  # CUDA Validation (self-hosted GPU runner)
  # ===========================================================================
  cuda-validation:
    name: CUDA Validation (Qwen3-0.6B)
    runs-on: [self-hosted, gpu, cuda]
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' &&
      contains(github.event.inputs.backends, 'cuda')) ||
      github.event_name == 'schedule'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Check CUDA availability
        run: |
          nvidia-smi
          python3 -c "import torch; print(f'CUDA: {torch.cuda.is_available()}, Device: {torch.cuda.get_device_name(0)}')"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install transformers
          pip install -e .

      - name: Run CUDA validation
        run: |
          mkdir -p results
          python3 << 'PYEOF'
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer
          import torch.nn.functional as F
          import time
          import json

          print("=== Qwen3-0.6B CUDA Validation ===")
          device = torch.device("cuda")
          print(f"Device: {torch.cuda.get_device_name(0)}")

          tokenizer = AutoTokenizer.from_pretrained("Qwen/Qwen3-0.6B")
          model = AutoModelForCausalLM.from_pretrained(
              "Qwen/Qwen3-0.6B", torch_dtype=torch.float32
          )
          model.eval()

          prompt = "The capital of France is"
          inputs = tokenizer(prompt, return_tensors="pt")

          # CPU reference
          with torch.no_grad():
              cpu_out = model(**inputs)
          cpu_logits = cpu_out.logits[:, -1, :]

          # GPU inference
          model_gpu = model.to(device)
          inputs_gpu = {k: v.to(device) for k, v in inputs.items()}
          with torch.no_grad():
              gpu_out = model_gpu(**inputs_gpu)
          gpu_logits = gpu_out.logits[:, -1, :].cpu()

          # Compare
          max_diff = torch.abs(cpu_logits - gpu_logits).max().item()
          cos_sim = F.cosine_similarity(
              cpu_logits.flatten().unsqueeze(0),
              gpu_logits.flatten().unsqueeze(0)
          ).item()

          # Benchmark
          for _ in range(3):
              model_gpu(**inputs_gpu)
          torch.cuda.synchronize()
          t0 = time.perf_counter()
          for _ in range(100):
              model_gpu(**inputs_gpu)
          torch.cuda.synchronize()
          latency = (time.perf_counter() - t0) / 100 * 1000

          passed = max_diff < 1e-4
          print(f"Max diff: {max_diff:.2e}")
          print(f"Cosine sim: {cos_sim:.6f}")
          print(f"Latency: {latency:.1f} ms")
          print(f"Status: {'PASSED' if passed else 'FAILED'}")

          results = {
              "backend": "cuda",
              "gpu": torch.cuda.get_device_name(0),
              "model": "Qwen/Qwen3-0.6B",
              "max_diff": max_diff,
              "cosine_sim": cos_sim,
              "latency_ms": latency,
              "passed": passed
          }

          with open("results/cuda_validation.json", "w") as f:
              json.dump(results, f, indent=2)
          PYEOF

      - name: Upload CUDA results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cuda-validation-results
          path: results/
          retention-days: 30

  # ===========================================================================
  # AMD ROCm Validation (self-hosted GPU runner)
  # ===========================================================================
  rocm-validation:
    name: AMD ROCm Validation (Qwen3-0.6B)
    runs-on: [self-hosted, gpu, amd]
    timeout-minutes: 30
    if: |
      (github.event_name == 'workflow_dispatch' &&
      contains(github.event.inputs.backends, 'rocm')) ||
      github.event_name == 'schedule'
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Check ROCm availability
        run: |
          rocm-smi --showproductname || echo "rocm-smi not available"
          python3 -c "import torch; print(f'ROCm: {torch.cuda.is_available()}, GPU: {torch.cuda.get_device_name(0)}')"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install transformers
          pip install -e .

      - name: Run ROCm validation
        run: |
          mkdir -p results
          python3 << 'PYEOF'
          import torch
          from transformers import AutoModelForCausalLM, AutoTokenizer
          import torch.nn.functional as F
          import time
          import json

          print("=== Qwen3-0.6B ROCm Validation ===")
          device = torch.device("cuda")
          print(f"Device: {torch.cuda.get_device_name(0)}")

          tokenizer = AutoTokenizer.from_pretrained("Qwen/Qwen3-0.6B")
          model = AutoModelForCausalLM.from_pretrained(
              "Qwen/Qwen3-0.6B", torch_dtype=torch.float32
          )
          model.eval()

          prompt = "The capital of France is"
          inputs = tokenizer(prompt, return_tensors="pt")

          # CPU reference
          with torch.no_grad():
              cpu_out = model(**inputs)
          cpu_logits = cpu_out.logits[:, -1, :]

          # GPU inference
          model_gpu = model.to(device)
          inputs_gpu = {k: v.to(device) for k, v in inputs.items()}
          with torch.no_grad():
              gpu_out = model_gpu(**inputs_gpu)
          gpu_logits = gpu_out.logits[:, -1, :].cpu()

          # Compare (ROCm tolerance is 1e-3 due to SDPA flash attention divergence)
          max_diff = torch.abs(cpu_logits - gpu_logits).max().item()
          cos_sim = F.cosine_similarity(
              cpu_logits.flatten().unsqueeze(0),
              gpu_logits.flatten().unsqueeze(0)
          ).item()

          # Benchmark
          for _ in range(3):
              model_gpu(**inputs_gpu)
          torch.cuda.synchronize()
          t0 = time.perf_counter()
          for _ in range(100):
              model_gpu(**inputs_gpu)
          torch.cuda.synchronize()
          latency = (time.perf_counter() - t0) / 100 * 1000

          passed = max_diff < 1e-3
          print(f"Max diff: {max_diff:.2e}")
          print(f"Cosine sim: {cos_sim:.6f}")
          print(f"Latency: {latency:.1f} ms")
          print(f"Status: {'PASSED' if passed else 'FAILED'}")

          results = {
              "backend": "rocm",
              "gpu": torch.cuda.get_device_name(0),
              "model": "Qwen/Qwen3-0.6B",
              "max_diff": max_diff,
              "cosine_sim": cos_sim,
              "latency_ms": latency,
              "passed": passed
          }

          with open("results/rocm_validation.json", "w") as f:
              json.dump(results, f, indent=2)
          PYEOF

      - name: Upload ROCm results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rocm-validation-results
          path: results/
          retention-days: 30

  # ===========================================================================
  # Summary Report
  # ===========================================================================
  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [cpu-baseline, cuda-validation, rocm-validation]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/
        continue-on-error: true

      - name: Generate summary
        run: |
          python3 << 'PYEOF'
          import json
          from pathlib import Path
          from datetime import datetime

          artifacts = Path("artifacts")
          summary_lines = [
              "# Qwen3-0.6B Cross-Backend Validation Summary",
              f"**Generated:** {datetime.now().isoformat()}",
              "",
              "| Backend | GPU | Max Diff | Cosine Sim | Latency | Status |",
              "|---------|-----|----------|------------|---------|--------|",
          ]

          for name in ["cpu-baseline-results", "cuda-validation-results", "rocm-validation-results"]:
              artifact_path = artifacts / name
              if artifact_path.exists():
                  for json_file in artifact_path.rglob("*.json"):
                      try:
                          data = json.load(open(json_file))
                          backend = data.get("backend", "?")
                          gpu = data.get("gpu", "CPU")
                          max_diff = data.get("max_diff", "N/A")
                          cos_sim = data.get("cosine_sim", "N/A")
                          latency = data.get("latency_ms", "N/A")
                          passed = data.get("passed", data.get("status") == "PASSED")
                          status = "PASSED" if passed else "FAILED"

                          md = f"{max_diff:.2e}" if isinstance(max_diff, float) else str(max_diff)
                          cs = f"{cos_sim:.6f}" if isinstance(cos_sim, float) else str(cos_sim)
                          lt = f"{latency:.1f} ms" if isinstance(latency, float) else str(latency)

                          summary_lines.append(f"| {backend} | {gpu} | {md} | {cs} | {lt} | {status} |")
                          break
                      except Exception:
                          pass
              else:
                  summary_lines.append(f"| {name.split('-')[0]} | — | — | — | — | SKIPPED |")

          summary = "\n".join(summary_lines)
          print(summary)

          with open("VALIDATION_SUMMARY.md", "w") as f:
              f.write(summary)
          PYEOF

      - name: Post summary to job
        run: cat VALIDATION_SUMMARY.md >> $GITHUB_STEP_SUMMARY

      - name: Upload summary
        uses: actions/upload-artifact@v7
        with:
          name: validation-summary
          path: VALIDATION_SUMMARY.md
          retention-days: 90
